[package]
name = "nuage-cli"
version = "0.5.0"
edition = "2021"
description = "File sync daemon for Nuage"

[[bin]]
name = "nuage"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
notify = "7"
notify-debouncer-mini = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls", "charset", "http2"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
glob-match = "0.2"
futures-util = "0.3"
indicatif = "0.17"
tokio-util = { version = "0.7", features = ["io"] }
daemonize = "0.5"
libc = "0.2"
shellexpand = "3"
rpassword = "7"

[profile.release]
strip = true
lto = true
